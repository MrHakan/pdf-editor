name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one more behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # The site is plain static files, so there is nothing to build — but the
      # syntax of every module is checked before anything is published.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check every module parses
        run: |
          status=0
          while IFS= read -r f; do
            if ! node --input-type=module --check < "$f"; then
              echo "::error file=$f::syntax error"
              status=1
            fi
          done < <(find src sw.js -name '*.js')
          exit $status

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - id: deployment
        uses: actions/deploy-pages@v4
